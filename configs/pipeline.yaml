# Reference end-to-end pipeline configuration (Design §2).

preprocess: configs/preprocess.yaml

layout:
  model: heuristic           # or a PP-DocLayout-lite / YOLO-doc checkpoint (§2)
  min_table_area_frac: 0.02

detect:
  model: dbnet               # §3; 3-5M params
  box_thresh: 0.3
  unclip_ratio: 1.6

recognize: configs/recognizer.yaml

table:
  ruled: morphology          # exact, 0 params (§4.1)
  borderless: slanet         # ~1M params (§4.2)
  span_detection: true

postprocess:                 # the non-LLM chain (§5) — NO LLM anywhere
  syllables: data/charset/syllables.txt
  constrained_decode: true   # trie-constrained CTC beam on the lattice (§5.1)
  beam_size: 16
  noisy_channel:             # §5.2
    max_edits: 2
  language_model:            # §5.3 — bigram/trigram tone recovery
    backend: count           # or kenlm
    path: data/lm/vi.count.pkl
    order: 3
    lm_weight: 1.0

output:
  format: json               # text | json | html
