# Reference preprocessing configuration (Design §1).
# Grayscale throughout; binarisation is used ONLY for table-line detection (§1.1).

dpi:
  enabled: true
  target_min: 300            # up-sample below this (§1.1)
  target: 400                # cap here; >600 DPI wastes compute
  super_resolution: bicubic  # swap in ESRGAN-lite for severe cases

deskew:
  enabled: true
  method: projection_variance
  limit_deg: 15.0
  step_deg: 0.5

dewarp:
  enabled: false             # only for phone photos / open books (§1.3)
  method: docunet_lite

contrast:
  enabled: true
  method: clahe              # local, not global (§1.4)
  clip_limit: 2.0
  tiles: 8

denoise:
  enabled: true
  method: bilateral          # edge-preserving; keeps diacritic edges (§1.5)
  d: 5
  sigma_color: 30
  sigma_space: 5

labels:
  unicode_normalize: nfc     # §1.6 — mandatory
  tone_placement: dictionary # canonicalise hoà -> hòa
